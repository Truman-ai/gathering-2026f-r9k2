<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gathering in Autumn</title>
<meta name="description" content="Oct 8–11, 2026 · YangPyoung, South Korea. Schedule in your time zone and Zoom details.">
<meta property="og:title" content="Gathering in Autumn">
<meta property="og:description" content="Oct 8–11, 2026 · YangPyoung, South Korea. Schedule in your time zone and Zoom details.">
<meta property="og:type" content="website">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first single column. Sticky time-zone chip bar; every time on the page follows the chosen zone. */
:root {
  --paper: #f3f3ef;
  --surface: #ffffff;
  --ink: #1c1f26;
  --muted: #646a74;
  --line: #dcdcd4;
  --ginkgo: #e2a516;
  --on-ginkgo: #1c1f26;
  --accent: #9a6a00;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  --font-body: "Figtree", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.wrap > * { min-width: 0; }
html, body { overflow-x: hidden; }

header { padding-top: 20px; display: grid; gap: 4px; }
.place { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(30px, 8.5vw, 52px); line-height: 1.02; letter-spacing: -.02em;
  margin: 0; text-wrap: balance;
}
.dates { font-family: var(--font-display); font-weight: 500; font-size: 16px; margin: 4px 0 0; }

/* Zone bar: compact 3-column grid; 2 columns on very narrow phones */
.zonebar { padding: 4px 0 12px; border-bottom: 1px solid var(--line); }
.zonebar .hint { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 339px) { .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chip {
  min-width: 0; width: 100%;
  font: 600 13px var(--font-body); color: var(--ink); text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 8px; cursor: pointer; line-height: 1.25;
}
.chip small { display: block; font-weight: 400; font-size: 10.5px; color: var(--muted); }
.chip[aria-checked="true"] { background: var(--ginkgo); border-color: var(--ginkgo); color: var(--on-ginkgo); }
.chip[aria-checked="true"] small { color: var(--on-ginkgo); opacity: .75; }
.chip.other { border-style: dashed; }
.chip.other[aria-checked="true"] { border-style: solid; }
.picker { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.device {
  font: 600 14px var(--font-body); color: var(--on-ginkgo); background: var(--ginkgo);
  border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; text-align: left;
}
.picker input {
  width: 100%; font: 16px var(--font-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
.picker input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { list-style: none; margin: 0; padding: 0; display: grid; }
.results button {
  width: 100%; display: flex; justify-content: space-between; gap: 12px; text-align: left;
  font: 14px var(--font-body); color: var(--ink); background: none; border: 0;
  border-bottom: 1px solid var(--line); padding: 9px 2px; cursor: pointer;
}
.results button span:last-child { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.results .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
.now { font-size: 13px; color: var(--muted); padding-top: 8px; font-variant-numeric: tabular-nums; }
.now b { color: var(--ink); font-weight: 600; }

button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Next-up */
.next {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: grid; gap: 2px;
}
.next .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.next .t { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.next .s { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

/* Overview */
.overview { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.overview > div { background: var(--paper); padding: 10px 0; display: grid; gap: 2px; min-width: 0; }
.overview > div:nth-child(even) { padding-left: 14px; }
.lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.val { font-weight: 600; font-variant-numeric: tabular-nums; }

h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

/* Schedule */
.day { margin-top: 14px; }
.day h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.sessions { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.sessions li { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.sessions li.past { opacity: .45; }
.time { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time small { font-size: 12px; font-weight: 500; margin-left: 2px; }
.what { min-width: 0; display: grid; gap: 2px; }
.what strong { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.num {
  flex: 0 0 auto; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--ink); font: 700 12px var(--font-display); font-variant-numeric: tabular-nums;
}
.num.blank { visibility: hidden; } /* keeps unnumbered items (Feast) aligned with the numbered ones */
.what .ref { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; border-radius: 999px; padding: 2px 8px; }
.pill.next-p { background: var(--ginkgo); color: var(--on-ginkgo); }
.pill.night { border: 1px solid var(--line); color: var(--muted); }

/* Zoom */
.zoom { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.zoom h2 { margin: 0; }
.cred { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cred .val { font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; }
.copy {
  font: 600 13px var(--font-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; flex: 0 0 auto;
}
.join {
  display: block; text-align: center; text-decoration: none;
  background: var(--ginkgo); color: var(--on-ginkgo); font-weight: 600;
  border-radius: 12px; padding: 11px;
}

footer { font-size: 13px; color: var(--muted); }

@media (min-width: 640px) {
  body { padding-inline: 24px; }
  .sessions li { grid-template-columns: 112px 1fr; }
  body { font-size: 16px; }
  h2 { font-size: 24px; }
  .time { font-size: 21px; }
  .next .t { font-size: 24px; }
  .dates { font-size: 19px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="place">YangPyoung, South Korea</div>
    <h1>Gathering in Autumn</h1>
    <p class="dates" id="dates">Oct 8 – 11, 2026</p>
  </header>

  <div class="zonebar">
    <div class="hint">Show times for</div>
    <div class="chips" id="chips" role="radiogroup" aria-label="Time zone"></div>
    <div class="picker" id="picker" hidden>
      <button class="device" id="useDevice" type="button"></button>
      <label class="lbl" for="tzSearch">Or search for your city</label>
      <input id="tzSearch" type="search" placeholder="e.g. Sydney, London, Dubai" autocomplete="off" enterkeyhint="search">
      <ul class="results" id="tzResults"></ul>
    </div>
    <div class="now" id="now"></div>
  </div>

  <section class="next" id="next" aria-live="polite"></section>

  <section class="overview" id="overview" aria-label="Overview"></section>

  <section>
    <h2>Schedule</h2>
    <p class="sub" id="schedSub"></p>
    <div id="schedule"></div>
  </section>

  <section class="zoom">
    <h2>Zoom meeting</h2>
    <div class="cred">
      <div><div class="lbl">Meeting ID</div><div class="val" id="zid">864 4145 9436</div></div>
      <button class="copy" type="button" data-copy="86441459436" data-target="zid">Copy</button>
    </div>
    <div class="cred">
      <div><div class="lbl">Passcode</div><div class="val" id="zpw">1234</div></div>
      <button class="copy" type="button" data-copy="1234" data-target="zpw">Copy</button>
    </div>
    <a class="join" href="https://zoom.us/j/86441459436" target="_blank" rel="noopener">Open in Zoom</a>
  </section>

  <footer>Meeting times are set in Korea time (KST). Times in other zones are converted automatically.</footer>
</div>

<script>
const ZONES = [
  { id: "kr", name: "Korea",                 place: "Seoul",           tz: "Asia/Seoul",          abbr: "KST" },
  { id: "ca", name: "California",            place: "Fountain Valley", tz: "America/Los_Angeles", abbr: "PDT" },
  { id: "ph", name: "Philippines",           place: "Manila",          tz: "Asia/Manila",         abbr: "PHT" },
  { id: "th", name: "Thailand",              place: "Bangkok",         tz: "Asia/Bangkok",        abbr: "ICT" },
  { id: "eu", name: "Europe", place: "Berlin · Zurich", tz: "Europe/Berlin",       abbr: "CEST", also: ["Europe/Zurich"] },
  { id: "vn", name: "Vietnam",               place: "Ho Chi Minh",     tz: "Asia/Ho_Chi_Minh",    abbr: "ICT", also: ["Asia/Saigon"] },
  { id: "mm", name: "Myanmar",               place: "Yangon",          tz: "Asia/Yangon",         abbr: "MMT", also: ["Asia/Rangoon"] },
  { id: "to", name: "Canada",                place: "Toronto",         tz: "America/Toronto",     abbr: "EDT" },
];

// Begins Thu evening Oct 8, ends Sun morning Oct 11 (KST)
const KINDS = { m: "Morning meeting", a: "Afternoon meeting", e: "Evening meeting", f: "Feast" };
const KST_TIMES = { m: "10:00", a: "13:30", e: "19:30" };
// A third entry overrides the usual time for that one session; the Feast is not counted as a numbered session
const PLAN = [["2026-10-08", "e"], ["2026-10-09", "m"], ["2026-10-09", "a"], ["2026-10-09", "e"],
              ["2026-10-10", "m"], ["2026-10-10", "a"], ["2026-10-10", "e"],
              ["2026-10-11", "f", "09:00"], ["2026-10-11", "m", "10:30"]];
let count = 0;
const SESSIONS = PLAN.map(([d, k, t]) => ({ kind: k, no: k === "f" ? null : ++count, start: new Date(`${d}T${t || KST_TIMES[k]}:00+09:00`) }));

// Add the viewer's own zone if it isn't one of the listed ones
const deviceTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return null; } })();
const findListed = tz => ZONES.find(z => z.tz === tz || (z.also || []).includes(tz));
const cityOf = tz => tz.split("/").pop().replace(/_/g, " ");
const makeCustom = tz => ({ id: "custom", name: cityOf(tz), place: tz.split("/")[0].replace(/_/g, " "), tz, abbr: null });
const validTz = tz => { try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return true; } catch (e) { return false; } };

function pickZone(tz) {
  return findListed(tz) || (validTz(tz) ? makeCustom(tz) : ZONES[0]);
}

let saved = null;
try { saved = localStorage.getItem("zone"); } catch (e) {}
// A link ending in #vn, #ph, etc. opens with that region selected
const fromHash = () => ZONES.find(z => z.id === location.hash.slice(1).toLowerCase());
let current = fromHash() || (saved && saved.startsWith("tz:") ? pickZone(saved.slice(3))
  : ZONES.find(z => z.id === saved) || (deviceTz ? pickZone(deviceTz) : ZONES[0]));

function choose(z) {
  current = z;
  try { localStorage.setItem("zone", z.id === "custom" ? "tz:" + z.tz : z.id); } catch (e) {}
  document.getElementById("picker").hidden = true;
  render();
}

const fmt = (tz, opts) => new Intl.DateTimeFormat("en-US", { timeZone: tz, ...opts });
const abbrOf = (z, date) => z.abbr || (fmt(z.tz, { timeZoneName: "short" }).formatToParts(date).find(p => p.type === "timeZoneName") || {}).value || "";
const timeParts = (z, d) => {
  const parts = fmt(z.tz, { hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(d);
  const get = t => (parts.find(p => p.type === t) || {}).value;
  return { hm: `${get("hour")}:${get("minute")}`, ap: get("dayPeriod"), h24: +fmt(z.tz, { hour: "numeric", hourCycle: "h23" }).format(d) };
};
const dayLabel = (z, d) => fmt(z.tz, { weekday: "short", month: "short", day: "numeric" }).format(d);
const timeStr = (z, d) => { const t = timeParts(z, d); return `${t.hm} ${t.ap}`; };
const KR = ZONES[0];

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = "";
  ZONES.forEach(z => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.id = "zone-" + z.id;
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", z === current);
    b.innerHTML = `${z.name}<small>${z.place} ${abbrOf(z, SESSIONS[0].start)}</small>`;
    b.addEventListener("click", () => choose(z));
    box.appendChild(b);
  });
  const custom = current.id === "custom";
  const o = document.createElement("button");
  o.type = "button"; o.className = "chip other"; o.id = "zone-other";
  o.setAttribute("role", "radio");
  o.setAttribute("aria-checked", custom);
  o.setAttribute("aria-expanded", !document.getElementById("picker").hidden);
  o.innerHTML = custom
    ? `${current.name}<small>${current.place} ${abbrOf(current, SESSIONS[0].start)}</small>`
    : `Other<small>Choose your city</small>`;
  o.addEventListener("click", togglePicker);
  box.appendChild(o);
}

const ALL_TZ = (() => {
  try { return Intl.supportedValuesOf("timeZone").filter(t => t.includes("/") && !t.startsWith("Etc/")); }
  catch (e) { return []; }
})();
const offsetOf = tz => {
  try {
    return (fmt(tz, { timeZoneName: "shortOffset" }).formatToParts(SESSIONS[0].start).find(p => p.type === "timeZoneName") || {}).value || "";
  } catch (e) { return ""; }
};

function togglePicker() {
  const pk = document.getElementById("picker");
  pk.hidden = !pk.hidden;
  document.getElementById("zone-other").setAttribute("aria-expanded", !pk.hidden);
  if (!pk.hidden) {
    const dev = document.getElementById("useDevice");
    dev.hidden = !deviceTz;
    if (deviceTz) dev.textContent = `Use my phone's time · ${cityOf(deviceTz)}`;
    showResults("");
  }
}

function showResults(q) {
  const ul = document.getElementById("tzResults");
  q = q.trim().toLowerCase().replace(/\s+/g, " ");
  if (!q) { ul.innerHTML = ""; return; }
  const hits = ALL_TZ.filter(t => t.toLowerCase().replace(/_/g, " ").includes(q)).slice(0, 12);
  if (!hits.length) {
    ul.innerHTML = `<li class="empty">No city found. Try a nearby major city.</li>`;
    return;
  }
  ul.innerHTML = "";
  hits.forEach(t => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span>${cityOf(t)} <small style="color:var(--muted)">${t.split("/")[0].replace(/_/g, " ")}</small></span><span>${offsetOf(t)}</span>`;
    b.addEventListener("click", () => choose(pickZone(t)));
    li.appendChild(b); ul.appendChild(li);
  });
}

window.addEventListener("hashchange", () => { const z = fromHash(); if (z) choose(z); });
document.getElementById("tzSearch").addEventListener("input", e => showResults(e.target.value));
document.getElementById("useDevice").addEventListener("click", () => deviceTz && choose(pickZone(deviceTz)));

function countdown(ms) {
  const m = Math.round(ms / 6e4), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24, mm = m % 60;
  if (d > 0) return `in ${d}d ${h}h`;
  if (h > 0) return `in ${h}h ${mm}m`;
  return `in ${mm} min`;
}

function render() {
  const z = current, now = new Date();
  renderChips();

  document.getElementById("now").innerHTML =
    `Now in ${z.name}: <b>${dayLabel(z, now)}, ${timeStr(z, now)}</b> ${abbrOf(z, now)}`;

  const first = SESSIONS[0].start, last = SESSIONS[SESSIONS.length - 1].start;
  const m1 = fmt(z.tz, { month: "short" }).format(first), m2 = fmt(z.tz, { month: "short" }).format(last);
  const d1 = fmt(z.tz, { day: "numeric" }).format(first), d2 = fmt(z.tz, { day: "numeric" }).format(last);
  document.getElementById("dates").textContent = m1 === m2 ? `${m1} ${d1} – ${d2}, 2026` : `${m1} ${d1} – ${m2} ${d2}, 2026`;

  document.getElementById("overview").innerHTML = `
    <div><span class="lbl">Begins</span><span class="val">${dayLabel(z, first)}</span><span class="val">${timeStr(z, first)}</span></div>
    <div><span class="lbl">Final session</span><span class="val">${dayLabel(z, last)}</span><span class="val">${timeStr(z, last)}</span></div>`;

  const nextIdx = SESSIONS.findIndex(s => s.start > now);
  const nextEl = document.getElementById("next");
  if (nextIdx === -1) {
    nextEl.innerHTML = `<span class="k">Gathering complete</span><span class="t">Thank you for joining</span>`;
  } else {
    const s = SESSIONS[nextIdx];
    nextEl.innerHTML = `<span class="k">Next · ${countdown(s.start - now)}</span>
      <span class="t">${s.no ? `Session ${s.no} · ` : ""}${KINDS[s.kind]}</span>
      <span class="s">${dayLabel(z, s.start)} · ${timeStr(z, s.start)} ${abbrOf(z, s.start)}</span>`;
  }

  document.getElementById("schedSub").textContent = z.id === "kr"
    ? "All times in Korea time (KST)."
    : `Times shown in ${z.name} time (${abbrOf(z, first)}). Korea time is listed under each meeting.`;

  const groups = new Map();
  SESSIONS.forEach((s, i) => {
    const key = dayLabel(z, s.start);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push([s, i]);
  });
  let html = "";
  groups.forEach((list, day) => {
    html += `<div class="day"><h3>${day}</h3><ul class="sessions">`;
    list.forEach(([s, i]) => {
      const t = timeParts(z, s.start);
      const past = s.start <= now && i !== nextIdx;
      const pills = [];
      if (i === nextIdx) pills.push(`<span class="pill next-p">Next</span>`);
      if (t.h24 < 6 || t.h24 >= 23) pills.push(`<span class="pill night">Late night</span>`);
      const ref = z.id === "kr" ? "" : `<span class="ref">${dayLabel(KR, s.start)} · ${timeStr(KR, s.start)} KST</span>`;
      html += `<li class="${past ? "past" : ""}">
        <span class="time">${t.hm}<small>${t.ap}</small></span>
        <div class="what"><strong>${s.no ? `<span class="num" aria-label="Session ${s.no}">${s.no}</span>` : `<span class="num blank" aria-hidden="true"></span>`}${KINDS[s.kind]}</strong>${ref}${pills.length ? `<div class="pills">${pills.join("")}</div>` : ""}</div>
      </li>`;
    });
    html += `</ul></div>`;
  });
  document.getElementById("schedule").innerHTML = html;
}

render();
setInterval(render, 30000);

document.querySelectorAll(".copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1500); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById(btn.dataset.target));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "Selected";
    };
    try { navigator.clipboard.writeText(btn.dataset.copy).then(done, fallback); } catch (e) { fallback(); }
  });
});
</script>

</body>
</html>
