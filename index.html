<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The site's root address forwards to the upcoming meeting's own page (/<yymmdd>/), listed in events.json.
     Older links to this address keep working; ?lang= and #zone are carried over. -->
<title>Fellowship Meetings</title>
<meta name="description" content="Meeting schedules in your time zone, with Zoom details.">
<meta property="og:title" content="Fellowship Meetings">
<meta property="og:description" content="Meeting schedules in your time zone, with Zoom details.">
<meta property="og:type" content="website">
<style>
:root { color-scheme: dark; --paper: #0f1322; --ink: #f2f3f8; --muted: #9ba2b8; --line: #262c43; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Inter", "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
main { max-width: 560px; margin: 0 auto; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li { border-bottom: 1px solid var(--line); }
a { display: block; padding: 12px 0; color: var(--ink); text-decoration: none; }
a small { display: block; color: var(--muted); }
p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <p id="msg">Opening the meeting page…</p>
  <ul id="list"></ul>
</main>
<script>
const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

fetch("events.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(events => {
    events.sort((a, b) => a.start.localeCompare(b.start));
    // The first meeting that hasn't ended yet; after the last one ends, stay on the last one
    const today = localDay();
    const target = events.find(e => e.end >= today) || events[events.length - 1];
    if (!target) throw new Error("no events");
    location.replace(`${target.id}/${location.search}${location.hash}`);
  })
  .catch(() => {
    document.getElementById("msg").textContent = "Could not open the meeting page automatically. Choose a meeting:";
    fetch("events.json").then(r => r.json()).then(events => {
      document.getElementById("list").innerHTML = events.map(e =>
        `<li><a href="${e.id}/">${e.title}<small>${e.start} – ${e.end}</small></a></li>`).join("");
    }).catch(() => {});
  });
</script>
</body>
</html>
