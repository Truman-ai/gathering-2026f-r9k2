<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>접수 현황 (관리자)</title>
  <link rel="stylesheet" href="assets/style.css?v=20260911" />
</head>
<body>
  <!-- 암호 입력 -->
  <div class="wrap" id="gateView">
    <div class="card gate">
      <div class="section-title" style="margin-top:0;padding-top:0;border-top:0">관리자 확인</div>
      <div class="field">
        <label class="lbl" for="pass">암호</label>
        <input type="password" id="pass" autocomplete="off" />
      </div>
      <button type="button" class="btn btn--block" id="enterBtn">들어가기</button>
      <div class="msg" id="gateMsg"></div>
      <div class="foot"><a href="index.html">← 접수 폼으로</a></div>
    </div>
  </div>

  <!-- 현황 (단계형) -->
  <div class="wrap wrap--wide" id="dashView" hidden>
    <header class="hero hero--row">
      <div>
        <h1 id="dashTitle">접수 현황</h1>
        <div class="sub" id="dashSub"></div>
      </div>
      <button type="button" class="btn btn--ghost btn--sm" id="refreshBtn">새로고침</button>
    </header>

    <div class="progress" style="margin-top:14px"><div class="progress__bar" id="progressBar"></div></div>

    <div class="adm-head">
      <h2 class="section-title" id="pageTitle" style="margin:0;border:0;padding:0"></h2>
    </div>

    <div class="spin" id="spin">불러오는 중...</div>
    <main id="admStage"></main>

    <footer class="adm-nav">
      <button type="button" class="btn btn--ghost" id="prevBtn">이전</button>
      <div class="adm-nav__meta" id="navMeta"></div>
      <button type="button" class="btn" id="nextBtn">다음</button>
    </footer>

    <div class="foot">
      <span id="sheetLink"></span> · <a href="index.html">접수 폼</a>
    </div>
  </div>

  <script src="assets/config.js?v=20260911"></script>
  <script src="assets/admin.js?v=20260911"></script>
</body>
</html>
